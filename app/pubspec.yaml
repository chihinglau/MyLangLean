name: mylanglean
description: "MyLangLean - AI podcast shadowing coach (OORA-style) for HarmonyOS / iOS."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.0
  # webfeed pins intl 0.17; DateFormat usage is compatible.
  intl: ^0.17.0
  webfeed: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
